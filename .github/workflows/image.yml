name: Imagem de compilação
on:
  push:
    branches: [main]
    paths: ['docker/**', 'config/toolchain.json', 'acbrlibgenerator/bootstrap.py', 'acbrlibgenerator/catalog.py', 'acbrlibgenerator/common.py', 'scripts/bootstrap.py', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Ler versões
        id: config
        shell: python
        run: |
          import json, os
          cfg = json.load(open('config/toolchain.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f"image=ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}/builder", file=out)
              print(f"repository={cfg['installers_repository']}", file=out)
              print(f"ref={cfg['installers_ref']}", file=out)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.config.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.config.outputs.image }}:toolchain-v1
          build-args: |
            INSTALLERS_REPOSITORY=${{ steps.config.outputs.repository }}
            INSTALLERS_REF=${{ steps.config.outputs.ref }}
          cache-from: type=gha,scope=pascal-builder
          cache-to: type=gha,mode=max,scope=pascal-builder
      - name: Registrar referência imutável
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
