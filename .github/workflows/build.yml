name: Gerar ACBrLib e Monitor
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  image:
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
  sources:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    concurrency:
      group: svn-mirror
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recuperar fontes já fixados nesta release
        if: github.event_name == 'release'
        id: snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_snapshot.py restore --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --tag "$RELEASE_TAG"
      - name: Instalar Git e git-svn compatíveis
        if: steps.snapshot.outputs.restored != 'true'
        run: bash scripts/install_git_svn.sh
      - uses: actions/cache/restore@v6
        if: steps.snapshot.outputs.restored != 'true'
        with:
          path: build/svn-mirror/.git
          key: svn-${{ hashFiles('config/mirror.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: svn-${{ hashFiles('config/mirror.json') }}-
      - name: Sincronizar SVN e publicar o mirror
        id: mirror
        if: steps.snapshot.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_mirror.py --repository "https://github.com/$GITHUB_REPOSITORY.git" --push
      - uses: actions/cache/save@v6
        if: steps.snapshot.outputs.restored != 'true'
        with:
          path: build/svn-mirror/.git
          key: svn-${{ hashFiles('config/mirror.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fixar revisão na própria release antes dos builds
        if: github.event_name == 'release' && steps.snapshot.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_snapshot.py freeze --repository "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --tag "$RELEASE_TAG"
      - name: Resolver fontes imutáveis
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.event_name != 'release' && steps.mirror.outputs.commit || '' }}
          SOURCE_LOCK: ${{ github.event_name == 'release' && 'dist/source-lock.json' || 'config/sources.lock.json' }}
        run: python scripts/resolve_sources.py --repository "https://github.com/$GITHUB_REPOSITORY.git" --ref "$SOURCE_REF" --lock "$SOURCE_LOCK"
      - name: Registrar revisão usada
        shell: python
        run: |
          import json, os
          lock = json.load(open('dist/source-lock.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print(f"Fontes ACBr: SVN r{lock['revision']} — Git `{lock['commit']}`", file=out)
      - uses: actions/upload-artifact@v7
        with:
          name: source-lock
          path: dist/source-lock.json
          overwrite: true
  linux:
    needs: [sources, image]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sources.outputs.commit }}
          path: build/acbr
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compilar na imagem preparada
        env:
          SOURCE_COMMIT: ${{ needs.sources.outputs.commit }}
          SOURCE_REVISION: ${{ needs.sources.outputs.revision }}
          REQUESTED_IMAGE: ${{ needs.image.outputs.image }}
        run: python3 scripts/ci_build.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acbr-linux64
          overwrite: true
          path: |
            dist/**/manifest.json
            dist/**/*.log
            dist/**/SHA256SUMS
            dist/**/*.zip
          if-no-files-found: warn
  windows:
    needs: sources
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sources.outputs.commit }}
          path: build/acbr
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Ler configuração
        id: config
        shell: python
        run: |
          import json, os
          cfg = json.load(open('config/toolchain.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f"repository={cfg['installers_repository'].removeprefix('https://github.com/').removesuffix('.git')}", file=out)
              print(f"ref={cfg['installers_ref']}", file=out)
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: ${{ steps.config.outputs.ref }}
          path: build/installers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/installers
      - working-directory: build/installers
        run: cargo build --release --locked -p acbrinstall -p pascalinstall
      - name: Instalar SVN
        shell: pwsh
        run: |
          choco install sliksvn --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar SVN' }
          'C:\Program Files\SlikSvn\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Preparar ambiente com os fontes espelhados
        env:
          SOURCE_COMMIT: ${{ needs.sources.outputs.commit }}
          SOURCE_REVISION: ${{ needs.sources.outputs.revision }}
        shell: pwsh
        run: python scripts/bootstrap.py --profile windows --environment C:/acbr-env --sources build/acbr --installers build/installers/target/release --state dist/bootstrap --existing-sources --expected-commit $env:SOURCE_COMMIT --expected-revision $env:SOURCE_REVISION
      - name: Instalar Inno Setup verificado
        shell: pwsh
        run: ./scripts/install_inno.ps1
      - name: Compilar projetos e instaladores
        env:
          SOURCE_COMMIT: ${{ needs.sources.outputs.commit }}
          SOURCE_REVISION: ${{ needs.sources.outputs.revision }}
        run: python scripts/ci_build.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acbr-windows
          overwrite: true
          path: |
            dist/**/manifest.json
            dist/**/*.log
            dist/**/environment.json
            dist/**/SHA256SUMS
            dist/**/*.zip
            dist/**/installer/*.exe
          if-no-files-found: warn
  release:
    needs: [sources, linux, windows]
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: acbr-*
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: source-lock
          path: .
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: generator
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sources.outputs.commit }}
          path: sources
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Montar ZIPs e instaladores no padrão FinalBuilder
        run: python generator/scripts/package_release.py --artifacts artifacts --sources sources --lock source-lock.json --output publish
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            publish/*.zip
            publish/*-Instalador.exe
            publish/release-manifest.json
            publish/SHA256SUMS
          fail_on_unmatched_files: true
