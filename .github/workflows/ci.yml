name: Verificação
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependências dos testes de integração SVN
        if: runner.os == 'Linux'
        run: bash scripts/install_git_svn.sh
      - run: python -m unittest discover -s tests -v
      - run: python scripts/acbrbuild.py --help
  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - run: docker build --check -f docker/Dockerfile .
